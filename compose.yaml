name: lk-yul

services:
  postgres:
    image: ${POSTGRES_IMAGE:-postgres:16-bookworm}
    restart: unless-stopped
    environment:
      POSTGRES_USER: lk_dev
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Create .env from .env.example and set POSTGRES_PASSWORD}
      POSTGRES_DB: postgres
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U lk_dev -d postgres"]
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 10s

  postgres-init:
    build:
      context: ./infrastructure/database
      dockerfile: Dockerfile.init
      args:
        BASE_IMAGE: ${POSTGRES_IMAGE:-postgres:16-bookworm}
    restart: "no"
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      PGHOST: postgres
      PGUSER: lk_dev
      PGPASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD}
    entrypoint: ["bash", "/bootstrap/postgres/init.sh"]

  sqlserver:
    image: ${SQLSERVER_IMAGE:-mcr.microsoft.com/mssql/server:2022-latest}
    restart: unless-stopped
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_PID: Developer
      MSSQL_SA_PASSWORD: ${MSSQL_SA_PASSWORD:?Create .env from .env.example and set MSSQL_SA_PASSWORD}
    ports:
      - "127.0.0.1:${SQLSERVER_PORT:-1433}:1433"
    volumes:
      - sqlserver-data:/var/opt/mssql
    healthcheck:
      test: ["CMD-SHELL", "SQLCMDPASSWORD=\"$$MSSQL_SA_PASSWORD\" /opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -C -b -Q 'SELECT 1' -o /dev/null"]
      interval: 5s
      timeout: 5s
      retries: 40
      start_period: 20s

  sqlserver-init:
    build:
      context: ./infrastructure/database
      dockerfile: Dockerfile.init
      args:
        BASE_IMAGE: ${SQLSERVER_IMAGE:-mcr.microsoft.com/mssql/server:2022-latest}
    restart: "no"
    depends_on:
      sqlserver:
        condition: service_healthy
    environment:
      SQLCMDPASSWORD: ${MSSQL_SA_PASSWORD:?Set MSSQL_SA_PASSWORD}
    entrypoint: ["bash", "/bootstrap/sqlserver/init.sh"]

volumes:
  postgres-data:
  sqlserver-data:
