name: Database infrastructure
on:
  workflow_dispatch:
  pull_request:
    paths:
      - compose.yaml
      - .env.example
      - .github/workflows/database-infrastructure.yml
      - infrastructure/database/**
      - public/legal_persons_lib/**
      - public/application_lib/**
      - public/private_lib/**
      - public/qbch_lib/**
      - private/legal_persons_lib/**
      - private/bureau_data_lib/**
      - private/bureau_web_ui_lib/**

permissions:
  contents: read

jobs:
  bootstrap:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x
      - name: Regenerate SQL and check for model drift
        shell: pwsh
        run: |
          ./infrastructure/database/Generate-Schema.ps1
          git diff --exit-code -- infrastructure/database/sql
          if ($LASTEXITCODE -ne 0) { throw 'Regenerate and commit SQL after changing EF models.' }
      - name: Create all databases and test repeat initialization
        shell: pwsh
        run: |
          Copy-Item .env.example .env
          ./infrastructure/database/Start-Databases.ps1
          ./infrastructure/database/Test-Databases.ps1
      - name: Seed public twice and verify authentication
        shell: pwsh
        run: |
          ./infrastructure/database/Seed-Public.ps1
          ./infrastructure/database/Seed-Public.ps1
          ./infrastructure/database/Use-LocalDatabases.ps1
          dotnet run --project infrastructure/database/tests/PublicSeedSmoke/PublicSeedSmoke.csproj
          if ($LASTEXITCODE -ne 0) { throw 'Public seed authentication check failed.' }
      - name: Container logs
        if: failure()
        run: docker compose logs --no-color
      - name: Remove disposable CI databases
        if: always()
        run: docker compose down --volumes
